<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Autospeed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#123055"/>
      <stop offset="1" stop-color="#001529"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2B7FE0"/>
      <stop offset="0.55" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#67D3FF"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板：面板侧栏深色 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 仪表弧：270°，底部留缺口，形成表盘 -->
  <path d="M17.86 46.14 A20 20 0 1 1 46.14 46.14"
        fill="none" stroke="url(#arc)" stroke-width="6.5"
        stroke-linecap="round"/>

  <!-- 指针：指向右上（高速区），长度贴近弧内缘 -->
  <path d="M32 32 L41.9 20.2"
        stroke="#F5F7FA" stroke-width="4.0" stroke-linecap="round"/>

  <!-- 中心轴 -->
  <circle cx="32" cy="32" r="3.8" fill="#F5F7FA"/>
  <circle cx="32" cy="32" r="1.6" fill="#409EFF"/>
</svg>
