version: '3.8'

services:
  autospeed:
    image: yuwancumian2009/autospeed:latest
    container_name: autospeed
    restart: always
    ports:
      # 左边是宿主机访问端口，可按需修改；右边 5000 是容器内部端口，不要改
      - "5000:5000"
    volumes:
      # 数据库与图表
      - ./data:/app/data
      # 持久化 Ookla license，避免容器重建后拿不到节点列表
      - ./ookla-config:/root/.config/ookla
      # 同步宿主机时区，保证定时任务和记录时间准确
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
